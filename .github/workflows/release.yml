name: Release

# Pushing a tag like v0.1.0 builds everything and publishes the GitHub release, the server and
# collector images, and the collector's Helm chart.
# Running it by hand builds everything without publishing, to check a release before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  binaries:
    name: Server and collector (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 (glibc 2.35) so the binaries run on older distros and on Debian 12.
          - { name: linux-amd64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: darwin-arm64, os: macos-14, target: aarch64-apple-darwin }
          - { name: darwin-amd64, os: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked -p telelog-server -p telelog-collector --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="0.0.0-dev"
          mkdir -p dist
          package() { # binary, license file
            dir="$1-$version-${{ matrix.name }}"
            mkdir -p "$dir"
            cp "target/${{ matrix.target }}/release/$1" "$dir/"
            cp "$2" README.md "$dir/"
            tar -czf "dist/$dir.tar.gz" "$dir"
            # The bare binary, for the container image.
            cp "target/${{ matrix.target }}/release/$1" "dist/$1-${{ matrix.name }}"
          }
          package telelog-server LICENSE-AGPL
          package telelog-collector LICENSE-APACHE
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  app:
    name: Desktop app (macOS universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-app
      - run: |
          cargo build --release --locked -p telelogs --target aarch64-apple-darwin
          cargo build --release --locked -p telelogs --target x86_64-apple-darwin
          lipo -create -output target/telelogs-universal \
            target/aarch64-apple-darwin/release/telelogs target/x86_64-apple-darwin/release/telelogs
          lipo -info target/telelogs-universal
      - name: Bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="0.0.0-dev"
          scripts/bundle-macos.sh --binary target/telelogs-universal
          mkdir -p dist
          # ditto keeps the bundle's structure and attributes the way Finder expects.
          ditto -c -k --keepParent target/release/Telelogs.app "dist/Telelogs-$version-macos-universal.zip"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/*
          if-no-files-found: error

  image:
    name: Image (${{ matrix.image }})
    needs: binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: telelog-server
            dockerfile: docker/release.Dockerfile
            description: "Telelogs server: tails Docker containers and archives logs to your buckets"
            license: AGPL-3.0-only
          - image: telelog-collector
            dockerfile: docker/collector.release.Dockerfile
            description: "Telelogs collector: sends Docker or Kubernetes logs to Telelog Cloud over one outbound connection"
            license: Apache-2.0
    permissions:
      contents: read
      packages: write
    env:
      # Don't attach a build record artifact; it isn't a release asset.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-linux-*
          path: dist
          merge-multiple: true
      - name: Restore the executable bit (artifacts drop it)
        run: |
          chmod +x dist/${{ matrix.image }}-linux-*
          ls -la dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=sha,enable=${{ github.ref_type != 'tag' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=${{ matrix.license }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  chart:
    name: Helm chart (telelog-collector)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and package, versioned like the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="0.0.0-dev"
          chart=deploy/helm/telelog-collector
          helm lint "$chart" --set gateway=https://gateway.example --set enrollToken=tle_example
          helm package "$chart" --version "$version" --app-version "$version" --destination dist
          ls -la dist
      # helm install oci://ghcr.io/<owner>/charts/telelog-collector
      - name: Push to the registry
        if: github.ref_type == 'tag'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/telelog-collector-*.tgz "oci://${REGISTRY}/charts"

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [binaries, app, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          # Only the archives are published; the bare binaries were for the image.
          files=(*.tar.gz *.zip)
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS
          notes="../release-notes/$GITHUB_REF_NAME.md"
          [[ -f "$notes" ]] || { echo "missing $notes" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${files[@]}" SHA256SUMS \
            --title "Telelogs $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
