{{- /* Reading pods and their logs is all the collector does in the cluster. */ -}}
{{- $rules := list (dict "apiGroups" (list "") "resources" (list "pods") "verbs" (list "get" "list" "watch")) (dict "apiGroups" (list "") "resources" (list "pods/log") "verbs" (list "get")) -}}
{{- if not .Values.namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "collector.name" . }}
  labels: {{- include "collector.labels" . | nindent 4 }}
rules: {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "collector.name" . }}
  labels: {{- include "collector.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "collector.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "collector.name" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "collector.name" $ }}
  namespace: {{ . }}
  labels: {{- include "collector.labels" $ | nindent 4 }}
rules: {{- toYaml $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "collector.name" $ }}
  namespace: {{ . }}
  labels: {{- include "collector.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "collector.name" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "collector.name" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
