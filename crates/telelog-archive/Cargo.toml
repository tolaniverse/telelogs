[package]
name = "telelog-archive"
description = "Telelogs' log archive: chunks of log lines in S3, R2, GCS or a local directory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["logs", "archive", "object-storage", "telelogs"]
categories = ["development-tools::debugging"]

[dependencies]
anyhow.workspace = true
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures.workspace = true
getrandom = "0.3"
object_store = { version = "0.14", features = ["aws", "gcp"] }
serde.workspace = true
serde_json = "1"
telelog-core.workspace = true
telelog-sources.workspace = true
tokio.workspace = true
tracing.workspace = true
url = "2"
zstd = "0.13"
