syntax = "proto3";

package telelog.v1;

import "google/protobuf/timestamp.proto";

// Served by telelog-server, consumed by telelog-app.
service LogService {
  // Lists every target the server can tail (containers, pods, VM files).
  rpc ListTargets(ListTargetsRequest) returns (ListTargetsResponse);
  // Streams log records from the selected targets until the client disconnects.
  rpc Tail(TailRequest) returns (stream LogRecord);
  // Streams a target, with its new state, whenever one starts, stops or is removed.
  rpc WatchTargets(WatchTargetsRequest) returns (stream Target);
  // Returns archived lines from the bucket, oldest first. FAILED_PRECONDITION when the server
  // has no archive configured.
  rpc Query(QueryRequest) returns (stream LogRecord);
  // Describes the archive bucket: where it is, how much it holds, and how it's doing.
  rpc GetStorage(GetStorageRequest) returns (StorageInfo);
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_DOCKER = 1;
  SOURCE_KIND_KUBERNETES = 2;
  SOURCE_KIND_VM = 3;
}

enum Stream {
  STREAM_UNSPECIFIED = 0;
  STREAM_STDOUT = 1;
  STREAM_STDERR = 2;
}

enum Level {
  LEVEL_UNKNOWN = 0;
  LEVEL_TRACE = 1;
  LEVEL_DEBUG = 2;
  LEVEL_INFO = 3;
  LEVEL_WARN = 4;
  LEVEL_ERROR = 5;
}

message Target {
  string id = 1;
  string name = 2;
  SourceKind source = 3;
  string state = 4;
  map<string, string> labels = 5;
}

message ListTargetsRequest {
  // Include stopped containers.
  bool all = 1;
}

message ListTargetsResponse {
  repeated Target targets = 1;
}

message WatchTargetsRequest {}

message TailRequest {
  // Target ids to tail. Empty means every running target.
  repeated string target_ids = 1;
  // Number of historical lines per target to send before following.
  uint32 backlog = 2;
}

message LogRecord {
  google.protobuf.Timestamp timestamp = 1;
  SourceKind source = 2;
  string origin = 3;
  Stream stream = 4;
  Level level = 5;
  string body = 6;
  map<string, string> labels = 7;
}

message QueryRequest {
  // Inclusive bounds; unset means unbounded (to defaults to now).
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  // Case-insensitive substring of the body or origin.
  string text = 3;
  // Lowest level to include; LEVEL_UNKNOWN includes everything.
  Level min_level = 4;
  // Most lines to return (the newest in the range). 0 uses the server default.
  uint32 limit = 5;
  // Per origin, skip lines at or after this time: the client already holds them live.
  // Origins not listed are returned in full, so lines from removed containers come back.
  map<string, google.protobuf.Timestamp> skip_from = 6;
}

message GetStorageRequest {}

message StorageInfo {
  bool enabled = 1;
  // Bucket URL without credentials.
  string location = 2;
  string provider = 3;
  uint64 objects = 4;
  uint64 bytes = 5;
  // True when the bucket held more objects than were counted.
  bool truncated = 6;
  // Start of the oldest archived day.
  google.protobuf.Timestamp oldest = 7;
  google.protobuf.Timestamp last_flush = 8;
  string last_error = 9;
  uint64 lines_archived = 10;
  // 0 keeps everything.
  uint32 retention_days = 11;
  uint32 flush_seconds = 12;
}
