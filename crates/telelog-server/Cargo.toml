[package]
name = "telelog-server"
description = "Telelogs server: collects logs and streams them to the desktop app"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"

[dependencies]
anyhow.workspace = true
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true
futures.workspace = true
getrandom = "0.3"
object_store = { version = "0.14", features = ["aws", "gcp"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json = "1"
telelog-core.workspace = true
telelog-proto.workspace = true
telelog-sources.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
zstd = "0.13"

[dev-dependencies]
rcgen = "0.14"
