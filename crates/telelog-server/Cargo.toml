[package]
name = "telelog-server"
description = "Telelogs server: collects logs and streams them to the desktop app"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["logs", "docker", "kubernetes", "log-aggregator", "grpc"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
telelog-archive.workspace = true
telelog-core.workspace = true
telelog-proto.workspace = true
telelog-sources.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
rcgen = "0.14"
