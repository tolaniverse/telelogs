[package]
name = "telelogs"
description = "Telelogs desktop app: a native log viewer for Docker and Kubernetes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["logs", "docker", "kubernetes", "gui", "gpui"]
categories = ["development-tools::debugging", "gui"]

[[bin]]
name = "telelogs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap.workspace = true
dirs = "6"
futures.workspace = true
rust-embed = "8"
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
gpui-kit = "0.7"
keyring = { version = "3", features = ["apple-native"] }
telelog-core.workspace = true
telelog-proto.workspace = true
tokio.workspace = true
tonic.workspace = true
